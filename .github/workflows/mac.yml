# Compila la app de PATCH para Mac en una máquina macOS de GitHub.
# Así se verifica el código Swift aunque se desarrolle desde Windows.
name: Compilar app de Mac

on:
  push:
    paths:
      - "mac/**"
      - "ui/**"
      - "scripts/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Swift
        run: swiftc --version
      - name: Compilar
        run: |
          swiftc -swift-version 5 -target arm64-apple-macos14.0 \
            mac/Fuentes/*.swift \
            -o "$RUNNER_TEMP/PATCH" \
            -framework AppKit -framework SwiftUI -framework AVFoundation -framework Speech -framework Carbon -framework WebKit
      - name: Revisar la sintaxis de los scripts
        run: |
          for f in scripts/*.sh instalar.sh mac/construir.sh; do bash -n "$f" && echo "ok $f"; done
      - name: Armar PATCH.app completo
        run: |
          bash mac/construir.sh
          test -f "$HOME/Applications/PATCH.app/Contents/MacOS/PATCH" && echo "app ok"
          test -f "$HOME/Applications/PATCH.app/Contents/Resources/ui/index.html" && echo "interfaz ok"
      - name: Probar los scripts de archivos
        run: |
          mkdir -p "$HOME/PATCH-Pruebas" registros
          echo "Contrato de prueba con Empresa Ejemplo" > "$HOME/PATCH-Pruebas/contrato.txt"
          textutil -convert docx "$HOME/PATCH-Pruebas/contrato.txt" -output "$HOME/PATCH-Pruebas/contrato.docx"
          bash scripts/leer.sh "$HOME/PATCH-Pruebas/contrato.docx" | grep -q "Empresa Ejemplo" && echo "leer.sh ok"
          echo borrar > "$HOME/PATCH-Pruebas/borrame.txt"
          bash scripts/papelera.sh "$HOME/PATCH-Pruebas/borrame.txt" /etc/hosts
          test -e "$HOME/.Trash/borrame.txt" && test ! -e "$HOME/PATCH-Pruebas/borrame.txt" && echo "papelera.sh ok"
          test -e /etc/hosts && echo "proteccion ok"
          bash scripts/buscar.sh "Quality" documento 0 5 || true
      - name: Probar organizar.sh (vista, ordenar sin sobrescribir, patrón, deshacer, protección)
        run: |
          set -e
          D="$HOME/PATCH-Orden"; mkdir -p "$D/PDF"
          for n in "foto a.png" "foto b.png" "contrato [v2].pdf" "notas.docx" "raro.xyz" "Screenshot 1.png" "bajando.crdownload"; do echo x > "$D/$n"; done
          echo viejo > "$D/PDF/contrato [v2].pdf"
          bash scripts/organizar.sh --carpeta "$D" --vista
          test -e "$D/foto a.png" && echo "vista no mueve ok"
          bash scripts/organizar.sh --carpeta "$D"
          test -e "$D/Imagenes/foto a.png" && test -e "$D/Capturas/Screenshot 1.png" && test -e "$D/Otros/raro.xyz"
          test -e "$D/PDF/contrato [v2] (2).pdf" && grep -q viejo "$D/PDF/contrato [v2].pdf" && echo "no sobrescribe ok"
          test -e "$D/bajando.crdownload" && echo "ignora descargas a medias ok"
          bash scripts/organizar.sh --deshacer ultimo
          test -e "$D/foto a.png" && test -e "$D/contrato [v2].pdf" && echo "deshacer ok"
          bash scripts/organizar.sh --carpeta "$D" --patron "*contrato*" --destino Contratos
          test -e "$D/Contratos/contrato [v2].pdf" && echo "patron ok"
          bash scripts/organizar.sh --carpeta "$HOME/Library" --vista | grep -q protegida && echo "proteccion ok"
